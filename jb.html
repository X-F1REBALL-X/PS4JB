<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4JB</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #05070a;
        color: #e8eef6;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      #brand {
        text-align: center;
        padding: 18px 12px 6px;
        background: transparent;
        border: none;
      }
      #ps4-anim {
        width: 120px;
        height: 120px;
        margin: 0 auto 6px;
        position: relative;
      }
      #ps4-anim svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ps4-ring {
        fill: none;
        stroke: #2a9fff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 180;
        stroke-dashoffset: 180;
        animation: ringDraw 2.4s ease-in-out infinite;
        transform-origin: 80px 80px;
      }
      .ps4-ring.r2 {
        stroke: #7ec8ff;
        stroke-width: 2;
        opacity: 0.55;
        animation-delay: 0.35s;
        animation-duration: 2.8s;
      }
      .ps4-mark {
        fill: #f2f6fb;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 2px;
        animation: ps4Pulse 2.4s ease-in-out infinite;
      }
      .ps4-bar {
        fill: #2a9fff;
        animation: barGlow 2.4s ease-in-out infinite;
      }
      @keyframes ringDraw {
        0% {
          stroke-dashoffset: 180;
          opacity: 0.35;
        }
        45% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        70% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -180;
          opacity: 0.35;
        }
      }
      @keyframes ps4Pulse {
        0%,
        100% {
          opacity: 0.75;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes barGlow {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      #brand-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #9eb0c4;
        margin: 0;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 36px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #2a9fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 200px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      #foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 10px;
        text-align: center;
        font-size: 12px;
        color: #5c6672;
        letter-spacing: 0.08em;
        pointer-events: none;
        line-height: 1.5;
      }
      #foot b {
        color: #9eb0c4;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <div id="ps4-anim" aria-hidden="true">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <circle class="ps4-ring" cx="80" cy="80" r="58" />
          <circle class="ps4-ring r2" cx="80" cy="80" r="68" />
          <rect class="ps4-bar" x="46" y="108" width="68" height="5" rx="2.5" />
          <text class="ps4-mark" x="80" y="88" text-anchor="middle">PS4</text>
        </svg>
      </div>
      <p id="brand-title">PS4JB</p>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
    <div id="foot">
      <b>X-F1REBALL-X</b>
    </div>
  </body>
</html>
