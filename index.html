<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4JB</title>
<style>
  html, body {
    margin:0; padding:0; height:100%;
    background:#000;
    color:#2a9fff;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif;
    overflow-x:hidden;
  }
  #bg {
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:0;
    background:#000 url("ps-controller-bg.jpg") center center no-repeat;
    background-size:cover;
    pointer-events:none;
  }
  #bg:after {
    content:"";
    position:absolute; top:0; right:0; bottom:0; left:0;
    background:rgba(0,0,0,0.55);
    pointer-events:none;
  }
  #brand, #wrap, #foot {
    position:relative; z-index:2;
  }

  #logo {
    display:block;
    width:120px;
    max-width:40vw;
    height:auto;
    margin:0 auto 12px;
    border-radius:12px;
    box-shadow:0 0 24px rgba(42,159,255,.35);
  }
  #brand {
    text-align:center; padding:28px 12px 8px;
    background:transparent; border:none;
  }
  #brand-title {
    font-size:16px; font-weight:700; letter-spacing:.28em;
    text-transform:uppercase; color:#2a9fff; margin:0;
    text-shadow:0 0 18px rgba(42,159,255,.45);
  }
  #wrap {
    padding:18px 20px 80px; max-width:520px; margin:0 auto;
    text-align:center;
  }
  #state {
    font-size:28px; font-weight:800; margin:18px 0 10px;
    letter-spacing:.03em; color:#2a9fff;
    text-shadow:0 0 22px rgba(42,159,255,.4);
  }
  #det { font-size:14px; color:#5eb6ff; margin:0 0 6px; }
  #det b { color:#9ad2ff; font-weight:600; }
  #cache {
    font-size:12px; color:#4a9fd8; margin:0 0 14px; min-height:14px;
  }
  #cache.cacheok { color:#5eb6ff; }
  .ok { color:#5eb6ff; } .bad { color:#5eb6ff; } .warn { color:#2a9fff; }

  #startBtn {
    display:none;
    margin:22px auto 0;
    padding:16px 28px;
    min-width:220px;
    border:2px solid #2a9fff;
    border-radius:6px;
    background:rgba(0,40,80,.65);
    color:#2a9fff;
    font-size:20px;
    font-weight:800;
    letter-spacing:.06em;
    text-decoration:none;
    cursor:pointer;
    text-shadow:0 0 12px rgba(42,159,255,.45);
    box-shadow:0 0 24px rgba(42,159,255,.25);
  }
  #startBtn.show { display:inline-block; }

  #foot {
    position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:#2a9fff; letter-spacing:.08em;
    pointer-events:none; line-height:1.5;
    text-shadow:0 0 12px rgba(42,159,255,.35);
    z-index:2;
  }
  #foot b { color:#2a9fff; font-weight:600; }

  #countdown {
    display:none;
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:9999;
    text-align:center;
    background:rgba(0,0,0,.88);
    padding-top:28%;
  }
  #countdown.show { display:block; }
  #countdown-num {
    font-size:120px; font-weight:900; line-height:1;
    color:#2a9fff;
    text-shadow:0 0 40px rgba(42,159,255,.55);
  }
  #countdown-label {
    margin-top:18px; font-size:14px; letter-spacing:.28em;
    text-transform:uppercase; color:#5eb6ff;
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="countdown" aria-live="assertive">
  <div id="countdown-num">3</div>
  <div id="countdown-label">starting</div>
</div>
<div id="brand">
  <img id="logo" src="ps-logo.jpg" alt="PlayStation">
  <p id="brand-title">PS4JB</p>
</div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <a id="startBtn" href="#">Press X to start</a>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var startBtn = document.getElementById("startBtn");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

    // Avoid URLSearchParams (missing on older PS4 WebKit).
    function getParam(name) {
        var q = location.search || "";
        if (q.charAt(0) === "?") q = q.substring(1);
        var parts = q.split("&");
        for (var i = 0; i < parts.length; i++) {
            var kv = parts[i].split("=");
            if (decodeURIComponent(kv[0]) === name) {
                return kv.length > 1 ? decodeURIComponent(kv[1]) : "";
            }
        }
        return null;
    }

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = getParam("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + (location.search || "");
    function runCountdown(done) {
        var overlay = document.getElementById("countdown");
        var numEl = document.getElementById("countdown-num");
        var labelEl = document.getElementById("countdown-label");
        if (!overlay || !numEl) { done(); return; }
        overlay.className = "show";
        var n = 3;
        numEl.textContent = String(n);
        if (labelEl) labelEl.textContent = "starting";
        var iv = setInterval(function () {
            n -= 1;
            if (n <= 0) {
                clearInterval(iv);
                numEl.textContent = "GO";
                if (labelEl) labelEl.textContent = "";
                setTimeout(function () {
                    overlay.className = "";
                    done();
                }, 350);
            } else {
                numEl.textContent = String(n);
            }
        }, 1000);
    }
    function go() {
        if (startBtn) startBtn.className = "";
        runCountdown(function () {
            setState("loading...", "warn");
            location.replace(target);
        });
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        if (startBtn) {
            startBtn.textContent = msg;
            startBtn.className = "show";
            try { startBtn.focus(); } catch (e) {}
        }
        var fired = false;
        function fire(ev) {
            if (fired) return;
            fired = true;
            if (ev && ev.preventDefault) ev.preventDefault();
            window.removeEventListener("click", fire, false);
            window.removeEventListener("keydown", fire, false);
            window.removeEventListener("touchstart", fire, false);
            if (startBtn) {
                startBtn.onclick = null;
                startBtn.className = "";
            }
            action();
        }
        window.addEventListener("click", fire, false);
        window.addEventListener("keydown", fire, false);
        window.addEventListener("touchstart", fire, false);
        if (startBtn) {
            startBtn.onclick = fire;
        }
    }

    if (!supported) {
        waitForTap("Press X to start", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.getAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("Press X to start", function () { location.reload(); });
    } else {
        setCache("checking cache...");
        var started = false;
        function startOnce() {
            if (started) return;
            started = true;
            go();
        }
        // Safety: never stay stuck on cache checking forever.
        setTimeout(function () {
            if (!started) {
                setCache("cache timeout -- continue");
                waitForTap("Press X to start", go);
            }
        }, 8000);
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("Press X to start", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("Press X to start", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            startOnce();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("Press X to start", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("Press X to start", go);
        }, false);
    }
})();
</script>
<div id="foot">
  <b>Created by X-F1REBALL-X</b>
</div>
</body>
</html>
