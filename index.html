<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Accept-CH" content="Sec-CH-UA-Model, Sec-CH-UA-Platform-Version, Sec-CH-UA-Platform">
<title>PS4JB</title>
<style>
  html, body {
    margin:0; padding:0; height:100%;
    background:#000;
    color:#2a9fff;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif;
    overflow-x:hidden;
  }
  #bg {
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:0;
    background:#000 url("ps-logo.jpg") center center no-repeat;
    background-size:cover;
    pointer-events:none;
  }
  #bg:after {
    content:"";
    position:absolute; top:0; right:0; bottom:0; left:0;
    background:rgba(0,0,0,0.55);
    pointer-events:none;
  }
  #brand, #wrap, #foot {
    position:relative; z-index:2;
  }
  #brand {
    text-align:center; padding:28px 12px 8px;
    background:transparent; border:none;
  }
  #brand-sub {
    margin:8px 0 0;
    font-size:14px;
    font-weight:600;
    letter-spacing:.12em;
    color:#ffffff;
    text-shadow:0 0 10px rgba(255,255,255,.35);
  }
  #brand-title {
    font-size:16px; font-weight:700; letter-spacing:.28em;
    text-transform:uppercase; color:#2a9fff; margin:0;
    text-shadow:0 0 18px rgba(42,159,255,.45);
  }
  #wrap {
    padding:18px 20px 16px; max-width:520px; margin:0 auto;
    text-align:center;
  }
  #state {
    font-size:28px; font-weight:800; margin:18px 0 10px;
    letter-spacing:.03em; color:#2a9fff;
    text-shadow:0 0 22px rgba(42,159,255,.4);
  }
  #det { font-size:14px; color:#5eb6ff; margin:0 0 6px; }
  #det b { color:#9ad2ff; font-weight:600; }
  #cache {
    font-size:12px; color:#4a9fd8; margin:0 0 14px; min-height:14px;
  }
  #cache.cacheok { color:#5eb6ff; }
  .ok { color:#5eb6ff; } .bad { color:#5eb6ff; } .warn { color:#2a9fff; }
  #foot {
    position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:#2a9fff; letter-spacing:.08em;
    pointer-events:none; line-height:1.5;
    text-shadow:0 0 12px rgba(42,159,255,.35);
    z-index:2;
  }
  #foot b { color:#2a9fff; font-weight:600; }
  #state.blocked {
    color:#ff6473;
    font-size:22px;
    text-shadow:0 0 12px rgba(255,100,115,.35);
  }
  body.device-blocked #cache,
  body.device-blocked #det { display:none !important; }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="brand">
  <p id="brand-title">PS4JB</p>
  <p id="brand-sub">6.00–12.02 &middot; 12.50–13.52</p>
</div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script src="device.js?v=1"></script>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

    function getParam(name) {
        var q = location.search || "";
        if (q.charAt(0) === "?") q = q.substring(1);
        var parts = q.split("&");
        for (var i = 0; i < parts.length; i++) {
            var kv = parts[i].split("=");
            if (decodeURIComponent(kv[0]) === name) {
                return kv.length > 1 ? decodeURIComponent(kv[1]) : "";
            }
        }
        return null;
    }

    var ROUTES = [
        { min: 600, max: 669, target: "chains/cssfontface/index.html", label: "CSSFontFace+Lapse", proven: false },
        { min: 670, max: 672, target: "chains/badhoist/index.html", label: "BadHoist", proven: false },
        { min: 700, max: 1102, target: "chains/cssfontface/index.html", label: "CSSFontFace+Lapse", proven: false },
        { min: 1103, max: 1202, target: "chains/slopkit/index.html", label: "Slopkit", proven: false },
        { min: 1250, max: 1300, target: "chains/slopkit/index.html", label: "Slopkit", proven: false },
        { min: 1302, max: 1352, target: "jb.html", label: "Relapse", proven: true,
          only: { 1302: 1, 1304: 1, 1350: 1, 1352: 1 } }
    ];

    var ua = navigator.userAgent || "";
    var isPs4 = /PlayStation\s+4/i.test(ua);
    if (!isPs4) {
        document.body.className = (document.body.className || "") + " device-blocked";
        function showBlocked(device) {
            setState(device + " — not supported", "blocked");
            if (detEl) detEl.textContent = "";
            if (cacheEl) cacheEl.textContent = "";
        }
        showBlocked(typeof detectDeviceFromUa === "function" ? detectDeviceFromUa(ua) : "Unknown device");
        if (typeof resolveDeviceLabel === "function") resolveDeviceLabel(ua, showBlocked);
        return;
    }

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(ua);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    function pickRoute(n) {
        if (n === null) return null;
        for (var i = 0; i < ROUTES.length; i++) {
            var r = ROUTES[i];
            if (n < r.min || n > r.max) continue;
            if (r.only && !r.only[n]) continue;
            return r;
        }
        return null;
    }

    var forced = getParam("force") === "1";
    var forceChain = getParam("chain");
    var route = pickRoute(fwnum);
    if (forceChain === "cssfontface") route = { target: "chains/cssfontface/index.html", label: "CSSFontFace+Lapse", proven: false };
    else if (forceChain === "psfree") route = { target: "chains/psfree-lapse/index.html", label: "PSFree+Lapse", proven: false };
    else if (forceChain === "slopkit") route = { target: "chains/slopkit/index.html", label: "Slopkit", proven: false };
    else if (forceChain === "relapse") route = { target: "jb.html", label: "Relapse", proven: true };
    else if (forceChain === "badhoist") route = { target: "chains/badhoist/index.html", label: "BadHoist", proven: false };

    var supported = forced || route !== null;
    var detBits = "firmware <b>" + (key || "unknown") + "</b>";
    if (route) {
        detBits += " &middot; <b>" + route.label + "</b>";
        if (!route.proven) detBits += " &middot; untested on this host";
        else detBits += " &middot; <b>supported</b>";
    } else {
        detBits += " &middot; no chain for this FW in phase 1";
    }
    detEl.innerHTML = detBits;

    var target = (route ? route.target : "jb.html") + (location.search || "");
    if (key) {
        target += (target.indexOf("?") >= 0 ? "&" : "?") + "fw=" + encodeURIComponent(key);
    }

    function go() {
        setState("loading...", "warn");
        location.replace(target);
    }

    if (!supported) {
        setState("no chain for this firmware", "blocked");
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.getAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        location.reload();
    } else {
        setCache("checking cache...");
        var started = false;
        function startOnce() {
            if (started) return;
            started = true;
            go();
        }
        setTimeout(function () {
            if (!started) {
                setCache("cache timeout -- continue");
                startOnce();
            }
        }, 8000);
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            startOnce();
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            location.reload();
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            startOnce();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            startOnce();
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            startOnce();
        }, false);
    }
})();
</script>
<div id="foot">
  <b>Created by X-F1REBALL-X</b>
</div>
</body>
</html>
