<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4JB</title>
<style>
  html, body {
    margin:0; padding:0; height:100%;
    background:#000;
    color:#2a9fff;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif;
    overflow-x:hidden;
  }
  #bg {
    position:fixed; inset:0; z-index:0;
    background:#000 url("ps4-bg.png") center center / cover no-repeat;
  }
  #bg::after {
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.75) 100%);
  }
  #brand, #wrap, #foot, #countdown { position:relative; z-index:1; }
  #brand {
    text-align:center; padding:28px 12px 8px;
    background:transparent; border:none;
  }
  #brand-title {
    font-size:16px; font-weight:700; letter-spacing:.28em;
    text-transform:uppercase; color:#2a9fff; margin:0;
    text-shadow:0 0 18px rgba(42,159,255,.45);
  }
  #wrap {
    padding:18px 20px 80px; max-width:520px; margin:0 auto;
    text-align:center;
  }
  #state {
    font-size:28px; font-weight:800; margin:18px 0 10px;
    letter-spacing:.03em; color:#2a9fff;
    text-shadow:0 0 22px rgba(42,159,255,.4);
  }
  #det { font-size:14px; color:#5eb6ff; margin:0 0 6px; }
  #det b { color:#9ad2ff; font-weight:600; }
  #cache {
    font-size:12px; color:#4a9fd8; margin:0 0 14px; min-height:14px;
  }
  #cache.cacheok { color:#5eb6ff; }
  .ok { color:#5eb6ff; } .bad { color:#5eb6ff; } .warn { color:#2a9fff; }
  #foot {
    position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:#2a9fff; letter-spacing:.08em;
    pointer-events:none; line-height:1.5;
    text-shadow:0 0 12px rgba(42,159,255,.35);
  }
  #foot b { color:#2a9fff; font-weight:600; }

  #countdown {
    display:none;
    position:fixed; inset:0; z-index:9999;
    align-items:center; justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.88);
  }
  #countdown.show { display:flex; }
  #countdown-num {
    font-size:120px; font-weight:900; line-height:1;
    color:#2a9fff;
    text-shadow:0 0 40px rgba(42,159,255,.55);
  }
  #countdown-label {
    margin-top:18px; font-size:14px; letter-spacing:.28em;
    text-transform:uppercase; color:#5eb6ff;
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="countdown" aria-live="assertive">
  <div id="countdown-num">3</div>
  <div id="countdown-label">starting</div>
</div>
<div id="brand">
  <p id="brand-title">PS4JB</p>
</div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function runCountdown(done) {
        var overlay = document.getElementById("countdown");
        var numEl = document.getElementById("countdown-num");
        var labelEl = document.getElementById("countdown-label");
        if (!overlay || !numEl) { done(); return; }
        overlay.className = "show";
        var n = 3;
        numEl.textContent = String(n);
        if (labelEl) labelEl.textContent = "starting";
        var iv = setInterval(function () {
            n -= 1;
            if (n <= 0) {
                clearInterval(iv);
                numEl.textContent = "GO";
                if (labelEl) labelEl.textContent = "";
                setTimeout(function () {
                    overlay.className = "";
                    done();
                }, 350);
            } else {
                numEl.textContent = String(n);
            }
        }, 1000);
    }
    function go() {
        runCountdown(function () {
            setState("loading jailbreak...", "warn");
            location.replace(target);
        });
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("Press X to start", "warn");
        waitForTap("Press X to start", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
<div id="foot">
  <b>X-F1REBALL-X</b>
</div>
</body>
</html>
